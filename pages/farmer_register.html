{% extends "base.html" %}

{% block title %}Register Farmer | Origin &amp; Acre{% endblock %}

{% block content %}
<section class="page-header">
    <p class="eyebrow"><a href="{{ url_for('farms') }}">← Farms</a></p>
    <h1>Register a farmer</h1>
</section>

{% if message %}
<div class="banner-message {% if success %}banner-message--success{% endif %}">
    {{ message }}
</div>
{% endif %}

<section class="settings-grid">
    <article class="info-card info-card--wide">
        <h2>Farm and farmer details</h2>
        {% include "reusable/farmer_register_form.html" %}
    </article>
</section>
{% endblock %}
